<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found · Beenetic Studios</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #fbfaf7;
    --surface: #ffffff;
    --text: #1c1f26;
    --muted: #545b69;
    --accent: #9a7106;
    --border: #e6e2d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161e;
      --surface: #1d2130;
      --text: #eef1f6;
      --muted: #a8b0be;
      --accent: #f5b700;
      --border: #2c3242;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: clamp(3rem, 9vw, 6rem) 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 39rem; margin: 0 auto; }
  h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 .5rem; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 2.5rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: .75rem; }
  a.card {
    display: block;
    padding: 1rem 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
  }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); }
  a.card strong { display: block; font-size: 1.05rem; }
  a.card span { color: var(--muted); font-size: .9rem; }
  footer {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: .85rem;
  }
  footer a { color: var(--accent); }
  .mark {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: fit-content;
    margin-bottom: 2.5rem;
    color: var(--text);
    text-decoration: none;
  }
  .mark img { width: 36px; height: 36px; flex: none; display: block; }
  .mark .name { font-size: 1.1rem; font-weight: 650; letter-spacing: -0.01em; }
</style>
</head>
<body>
<main>
  <a class="mark" href="https://www.beeneticstudios.com/">
    <img src="/logo-200.png" width="36" height="36" alt="">
    <span class="name">Beenetic Studios</span>
  </a>
  <h1>Page Not Found</h1>
  <p class="sub">There is nothing at this address. It may have moved, or the link may be mistyped.</p>

  <ul>
    <li>
      <a class="card" href="/">
        <strong>Legal</strong>
        <span>Every policy and notice, in one place</span>
      </a>
    </li>
    <li>
      <a class="card" href="https://www.beeneticstudios.com/support/">
        <strong>Support</strong>
        <span>Help with a game, and how to reach us</span>
      </a>
    </li>
  </ul>

  <footer>
    &copy; 2026 Beenetic Studios ·
    <a href="https://www.beeneticstudios.com/">beeneticstudios.com</a> ·
    <a href="https://www.beeneticstudios.com/support/">Support</a>
  </footer>
</main>
</body>
</html>
