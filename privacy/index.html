<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy · Beenetic Studios</title>
<meta name="description" content="Privacy policy for Beenetic Studios products.">

<!--
  PLACEHOLDER. Remove this noindex line when the real policy goes up, so the page

-->
<meta name="robots" content="noindex">

<style>
  :root {
    --bg: #ffffff;
    --surface: #f4f4f6;
    --text: #16181d;
    --muted: #5c626e;
    --accent: #2f7ef0;
    --border: #e2e4e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1d2026;
      --text: #eceef2;
      --muted: #9aa1ae;
      --accent: #5a9dff;
      --border: #2a2e36;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; }
  .back { display: inline-block; margin-bottom: 2rem; color: var(--accent); text-decoration: none; font-size: .9rem; }
  .back:hover { text-decoration: underline; }
  h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 .5rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.15rem; margin: 2.5rem 0 .75rem; }
  .updated { color: var(--muted); font-size: .9rem; margin: 0 0 2.5rem; }
  .notice {
    padding: 1.25rem 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .notice p { margin: 0; }
  .notice p + p { margin-top: .75rem; }
  footer {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: .85rem;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <a class="back" href="/">&larr; Legal</a>

  <h1>Privacy Policy</h1>
  <p class="updated">Last updated: not yet published</p>

  <div class="notice">
    <p>This policy is in preparation and is not yet in effect.</p>
    <p>
      It will be published here before Beenetic Studios apps are released, and this
      address will not change.
    </p>
  </div>

  <!--
    ============================================================================
    WHEN YOU WRITE THE REAL POLICY

    Replace the .notice block above with the sections below, set the "Last
    updated" date, and delete the noindex meta tag in the head.

    Keep this URL forever. Both store listings point at it, and changing it
    means editing both.

    Sections the Google Play and App Store reviews expect to find:

      <h2>What we collect</h2>
      <h2>How we use it</h2>
      <h2>Who we share it with</h2>       (name the backend and any SDKs)
      <h2>How long we keep it</h2>
      <h2>Your choices and rights</h2>    (access, deletion, how to ask)
      <h2>Children</h2>                   (state the age policy plainly)
      <h2>Changes to this policy</h2>
      <h2>Contact</h2>                    (a real address someone reads)

    Two that trip people up: the deletion route has to be a real, working
    request path, and the children's section has to match the age rating you
    actually claim in each store listing.
    ============================================================================
  -->

  <footer>
    &copy; 2026 Beenetic Studios ·
    <a href="https://www.beeneticstudios.com/">beeneticstudios.com</a>
  </footer>
</main>
</body>
</html>
