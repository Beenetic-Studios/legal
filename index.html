<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal · Beenetic Studios</title>
<meta name="description" content="Legal documents for Beenetic Studios products.">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f4f4f6;
    --text: #16181d;
    --muted: #5c626e;
    --accent: #2f7ef0;
    --border: #e2e4e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1d2026;
      --text: #eceef2;
      --muted: #9aa1ae;
      --accent: #5a9dff;
      --border: #2a2e36;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 .5rem; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 2.5rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: .75rem; }
  a.card {
    display: block;
    padding: 1rem 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
  }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); }
  a.card strong { display: block; font-size: 1.05rem; }
  a.card span { color: var(--muted); font-size: .9rem; }
  footer {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: .85rem;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Legal</h1>
  <p class="sub">Policies and notices for Beenetic Studios products.</p>

  <ul>
    <li>
      <a class="card" href="/privacy/">
        <strong>Privacy Policy</strong>
        <span>How we handle your information</span>
      </a>
    </li>
    <li>
      <a class="card" href="/terms/">
        <strong>Terms of Use</strong>
        <span>The rules for playing, including the community rules</span>
      </a>
    </li>
    <li>
      <a class="card" href="/delete-account/">
        <strong>Delete Your Account</strong>
        <span>Remove your account and the data attached to it</span>
      </a>
    </li>
  </ul>

  <footer>
    &copy; 2026 Beenetic Studios ·
    <a href="https://www.beeneticstudios.com/">beeneticstudios.com</a>
  </footer>
</main>
</body>
</html>
